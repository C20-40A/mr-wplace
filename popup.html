<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. WPlace Settings</title>

    <style>
      @font-face {
        font-family: "MisakiGothic";
        src: url("assets/fonts/misaki/misaki_gothic.ttf") format("truetype");
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        background: #000;
        color: #fff;
        font-family: "MisakiGothic", monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      .container {
        border: 2px solid #fff;
        padding: 12px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .header h2 {
        margin: 0;
        font-size: 14px;
        font-weight: normal;
      }

      .header-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        color: #fff;
        text-decoration: none;
      }

      .header-link:hover {
        opacity: 0.8;
      }

      .header-link:active {
        opacity: 0.6;
      }

      .header-link .icon {
        width: 14px;
        height: 14px;
      }

      .setting-group {
        border: 1px solid #fff;
        padding: 8px;
        margin-bottom: 8px;
      }

      .setting-label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .setting-row + .setting-row {
        margin-top: 4px;
      }

      /* SVG icon */
      .icon {
        width: 12px;
        height: 12px;
        fill: #fff;
        flex-shrink: 0;
      }

      select {
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
      }

      select:focus {
        outline: none;
        background: #fff;
        color: #000;
      }

      /* Toggle button */
      .toggle-btn {
        background: #000;
        color: #888;
        border: 1px solid #888;
        padding: 2px 0;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        width: 42px;
        text-align: center;
        flex-shrink: 0;
      }

      .toggle-btn[data-on="true"] {
        color: #0f0;
        border-color: #0f0;
      }

      .toggle-btn:active {
        background: #fff;
        color: #000;
      }

      button {
        width: 100%;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button + button {
        margin-top: 4px;
      }

      button:active {
        background: #fff;
        color: #000;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-danger {
        border-style: dashed;
      }

      .coffee-support {
        border-top: 1px solid #fff;
        margin-top: 8px;
        padding-top: 8px;
      }

      .bug-report-link {
        display: block;
        width: 100%;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
        text-align: center;
        text-decoration: none;
        margin-bottom: 8px;
        cursor: pointer;
      }

      .bug-report-link:hover {
        background: #333;
      }

      .bug-report-link:active {
        background: #fff;
        color: #000;
      }

      .coffee-btn img {
        max-width: 100%;
        max-height: 32px;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h2>Mr. WPlace</h2>
        <a
          class="header-link"
          href="https://wplace.live/"
          target="_blank"
          rel="noopener noreferrer"
          title="Open WPlace Official Site"
          aria-label="Open WPlace Official Site"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle
              cx="12"
              cy="12"
              r="9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path
              d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
            />
          </svg>
        </a>
      </div>

      <!-- Language (keep as select - not a boolean toggle) -->
      <div class="setting-group">
        <div class="setting-row">
          <span id="popup-language-label">Language</span>
          <select id="language-select">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="pt">Português</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="vi">Tiếng Việt</option>
            <option value="fr">Français</option>
            <option value="ru">Русский</option>
          </select>
        </div>
      </div>

      <!-- FAB Visibility -->
      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <circle cx="4" cy="8" r="3" fill="none" stroke="#fff" stroke-width="1" />
            <circle cx="8" cy="4" r="3" fill="none" stroke="#fff" stroke-width="1" />
          </svg>
          <span id="popup-fab-visibility-label">FAB Visibility</span>
        </label>
        <div id="fab-visibility-selectors">
          <div class="setting-row">
            <span id="popup-fab-gallery-label">Gallery</span>
            <button class="toggle-btn" data-fab="gallery" data-on="true">ON</button>
          </div>
          <div class="setting-row">
            <span id="popup-fab-bookmark-label">Bookmark</span>
            <button class="toggle-btn" data-fab="bookmark" data-on="true">ON</button>
          </div>
          <div class="setting-row">
            <span id="popup-fab-time-travel-label">Time Travel</span>
            <button class="toggle-btn" data-fab="time-travel" data-on="true">ON</button>
          </div>
          <div class="setting-row">
            <span id="popup-fab-data-saver-label">Data Saver</span>
            <button class="toggle-btn" data-fab="data-saver" data-on="true">ON</button>
          </div>
          <div class="setting-row">
            <span id="popup-fab-filter-label">Filter</span>
            <button class="toggle-btn" data-fab="filter" data-on="true">ON</button>
          </div>
        </div>
      </div>

      <!-- Boolean toggle settings (1 row each) -->
      <div class="setting-group">
        <div class="setting-row">
          <span id="popup-lock-button-label">Large Lock Button (for Mobile)</span>
          <button class="toggle-btn" id="lock-button-enhancer-toggle" data-on="false">OFF</button>
        </div>
        <div class="setting-row">
          <span id="popup-close-confirm-label">Confirm on Close Paint Modal</span>
          <button class="toggle-btn" id="close-confirm-toggle" data-on="false">OFF</button>
        </div>
        <div class="setting-row">
          <span id="popup-paint-mode-style-label">Hide FABs on Paint Mode</span>
          <button class="toggle-btn" id="paint-mode-style-toggle" data-on="true">ON</button>
        </div>
        <div class="setting-row">
          <span id="popup-close-button-big-label">Big Close Button</span>
          <button class="toggle-btn" id="close-button-big-toggle" data-on="true">ON</button>
        </div>
      </div>

      <!-- Processing (GPU/CPU - keep as select) -->
      <div class="setting-group">
        <div class="setting-row">
          <span id="popup-compute-device-label">Processing</span>
          <select id="compute-device-select">
            <option value="gpu">GPU</option>
            <option value="cpu">CPU</option>
          </select>
        </div>
      </div>

      <!-- Navigation (hidden by default) -->
      <div class="setting-group" id="navigation-setting" style="display: none">
        <div class="setting-row">
          <span id="popup-navigation-label">Navigation</span>
          <select id="navigation-select">
            <option value="true" id="popup-nav-map-jump">Map Jump</option>
            <option value="false" id="popup-nav-url-jump">URL Jump</option>
          </select>
        </div>
      </div>

      <!-- Danger Zone -->
      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path
              d="M6 1L6 11M1 6L11 6"
              stroke="#f00"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
          <span id="danger-zone-label" style="color: #f00">Danger Zone</span>
        </label>
        <button
          id="toggle-danger-zone-btn"
          style="border-color: #f00; color: #f00"
        >
          <span id="danger-zone-toggle-label">Show Reset Options</span>
        </button>
        <div id="danger-zone-content" style="display: none; margin-top: 4px">
          <button id="reset-gallery-btn" class="btn-danger">
            🗑️ <span id="reset-gallery-btn-label">Reset Gallery</span>
          </button>
          <button id="reset-areas-btn" class="btn-danger">
            🗑️ <span id="reset-areas-btn-label">Reset Areas</span>
          </button>
        </div>
      </div>

      <div class="coffee-support">
        <a
          id="feedback-link"
          class="bug-report-link"
          target="_blank"
          href="https://docs.google.com/forms/d/e/1FAIpQLSdjPLjn76n3H2g_9kYqasCkr_qqa-gLfOuhoT_8ukIvpYE8bQ/viewform?usp=publish-editor"
        >
          <span id="popup-bug-report-label">Bug Report</span>
        </a>

        <a
          href="https://buymeacoffee.com/c20_40a"
          target="_blank"
          class="coffee-btn"
        >
          <img id="coffee-img" src="" alt="Buy Me A Coffee" />
        </a>
      </div>
    </div>

    <script src="dist/popup.js"></script>
  </body>
</html>
