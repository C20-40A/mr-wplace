<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. WPlace Settings</title>

    <style>
      @font-face {
        font-family: "MisakiGothic";
        src: url("assets/fonts/misaki/misaki_gothic.ttf") format("truetype");
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        background: #000;
        color: #fff;
        font-family: "MisakiGothic", monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      .container {
        border: 2px solid #fff;
        padding: 12px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .header h2 {
        margin: 0;
        font-size: 14px;
        font-weight: normal;
      }

      .header-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        color: #fff;
        text-decoration: none;
      }

      .header-link:hover {
        opacity: 0.8;
      }

      .header-link:active {
        opacity: 0.6;
      }

      .header-link .icon {
        width: 14px;
        height: 14px;
      }

      .setting-group {
        border: 1px solid #fff;
        padding: 8px;
        margin-bottom: 8px;
      }

      .setting-label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      /* SVG アイコン */
      .icon {
        width: 12px;
        height: 12px;
        fill: #fff;
        flex-shrink: 0;
      }

      select {
        width: 100%;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
      }

      select:focus {
        outline: none;
        background: #fff;
        color: #000;
      }

      button {
        width: 100%;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button + button {
        margin-top: 4px;
      }

      button:active {
        background: #fff;
        color: #000;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-danger {
        border-style: dashed;
      }

      .fab-visibility-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .fab-visibility-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .fab-visibility-item .setting-select {
        width: 90px;
        min-width: 90px;
      }

      .coffee-support {
        border-top: 1px solid #fff;
        margin-top: 8px;
        padding-top: 8px;
      }

      /* Bug Report をボタン風のリンクに */
      .bug-report-link {
        display: block;
        width: 100%;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
        text-align: center;
        text-decoration: none;
        margin-bottom: 8px;
        cursor: pointer;
      }

      .bug-report-link:hover {
        background: #333;
      }

      .bug-report-link:active {
        background: #fff;
        color: #000;
      }

      /* coffee img サイズ制限 */
      .coffee-btn img {
        max-width: 100%;
        max-height: 32px;
        display: block;
      }
    </style>
  </head>

  <body>
      <div class="container">
        <div class="header">
          <h2>Mr. WPlace</h2>
          <a
            class="header-link"
            href="https://wplace.live/"
            target="_blank"
            rel="noopener noreferrer"
            title="Open WPlace Official Site"
            aria-label="Open WPlace Official Site"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle
                cx="12"
                cy="12"
                r="9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              />
            </svg>
          </a>
        </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <circle cx="6" cy="6" r="5" />
          </svg>
          <span id="popup-language-label">Language</span>
        </label>
        <select id="language-select">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
          <option value="ja">日本語</option>
          <option value="vi">Tiếng Việt</option>
          <option value="fr">Français</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <rect x="3" y="5" width="6" height="5" />
            <path d="M5 5V3a1 1 0 0 1 2 0v2" />
          </svg>
          <span id="popup-lock-button-label"
            >Large Lock Button (for Mobile)</span
          >
        </label>
        <select id="lock-button-enhancer-select">
          <option value="true" class="popup-enabled-option">Enabled</option>
          <option value="false" class="popup-disabled-option">Disabled</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path d="M6 1L6 7M3 4L6 1L9 4" />
            <path d="M2 11h8" />
          </svg>
          <span id="popup-close-confirm-label"
            >Confirm on Close Paint Modal</span
          >
        </label>
        <select id="close-confirm-select">
          <option value="false" class="popup-disabled-option">Disabled</option>
          <option value="true" class="popup-enabled-option">Enabled</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path d="M2 3h8v1H2zM4 6h4v1H4zM3 9h6v1H3z" />
          </svg>
          <span id="popup-paint-mode-style-label">Hide FABs on Paint Mode</span>
        </label>
        <select id="paint-mode-style-select">
          <option value="true" class="popup-enabled-option">Enabled</option>
          <option value="false" class="popup-disabled-option">Disabled</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path
              d="M9 3L3 9M3 3l6 6"
              stroke="#fff"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
          <span id="popup-close-button-big-label"
            >Big Close Button</span
          >
        </label>
        <select id="close-button-big-select">
          <option value="true" class="popup-enabled-option">Enabled</option>
          <option value="false" class="popup-disabled-option">Disabled</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <rect x="2" y="2" width="3" height="3" />
            <rect x="7" y="2" width="3" height="3" />
            <rect x="2" y="7" width="3" height="3" />
            <rect x="7" y="7" width="3" height="3" />
          </svg>
          <span id="popup-compute-device-label">Processing</span>
        </label>
        <select id="compute-device-select">
          <option value="gpu">GPU</option>
          <option value="cpu">CPU</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <circle cx="4" cy="8" r="3" fill="none" stroke="#fff" stroke-width="1" />
            <circle cx="8" cy="4" r="3" fill="none" stroke="#fff" stroke-width="1" />
          </svg>
          <span id="popup-fab-visibility-label">FAB Visibility</span>
        </label>
        <div class="fab-visibility-list" id="fab-visibility-selectors">
          <div class="fab-visibility-item">
            <span id="popup-fab-gallery-label">Gallery</span>
            <select class="setting-select" data-fab="gallery">
              <option value="true" class="popup-enabled-option">Enabled</option>
              <option value="false" class="popup-disabled-option">Disabled</option>
            </select>
          </div>
          <div class="fab-visibility-item">
            <span id="popup-fab-bookmark-label">Bookmark</span>
            <select class="setting-select" data-fab="bookmark">
              <option value="true" class="popup-enabled-option">Enabled</option>
              <option value="false" class="popup-disabled-option">Disabled</option>
            </select>
          </div>
          <div class="fab-visibility-item">
            <span id="popup-fab-time-travel-label">Time Travel</span>
            <select class="setting-select" data-fab="time-travel">
              <option value="true" class="popup-enabled-option">Enabled</option>
              <option value="false" class="popup-disabled-option">Disabled</option>
            </select>
          </div>
          <div class="fab-visibility-item">
            <span id="popup-fab-data-saver-label">Data Saver</span>
            <select class="setting-select" data-fab="data-saver">
              <option value="true" class="popup-enabled-option">Enabled</option>
              <option value="false" class="popup-disabled-option">Disabled</option>
            </select>
          </div>
          <div class="fab-visibility-item">
            <span id="popup-fab-filter-label">Filter</span>
            <select class="setting-select" data-fab="filter">
              <option value="true" class="popup-enabled-option">Enabled</option>
              <option value="false" class="popup-disabled-option">Disabled</option>
            </select>
          </div>
        </div>
      </div>

      <div class="setting-group" id="navigation-setting" style="display: none">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <rect x="1" y="1" width="10" height="10" />
          </svg>
          <span id="popup-navigation-label">Navigation</span>
        </label>
        <select id="navigation-select">
          <option value="true" id="popup-nav-map-jump">Map Jump</option>
          <option value="false" id="popup-nav-url-jump">URL Jump</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path d="M2 2h8v8H2z" />
          </svg>
          <span id="gallery-data-label">Gallery Data</span>
        </label>

        <button id="export-gallery-btn">
          📤 <span id="export-btn-label">Export</span>
        </button>
        <button id="import-gallery-btn">
          📥 <span id="import-btn-label">Import</span>
        </button>

        <input
          type="file"
          id="import-gallery-file"
          accept=".zip"
          style="display: none"
        />
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path
              d="M6 1L6 11M1 6L11 6"
              stroke="#f00"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
          <span id="danger-zone-label" style="color: #f00">Danger Zone</span>
        </label>

        <button id="toggle-danger-zone-btn" style="border-color: #f00; color: #f00">
          <span id="danger-zone-toggle-label">Show Reset Options</span>
        </button>

        <div id="danger-zone-content" style="display: none; margin-top: 4px">
          <button id="reset-gallery-btn" class="btn-danger">
            🗑️ <span id="reset-gallery-btn-label">Reset Gallery</span>
          </button>
          <button id="reset-areas-btn" class="btn-danger">
            🗑️ <span id="reset-areas-btn-label">Reset Areas</span>
          </button>
        </div>
      </div>

      <div class="coffee-support">
        <a
          id="feedback-link"
          class="bug-report-link"
          target="_blank"
          href="https://docs.google.com/forms/d/e/1FAIpQLSdjPLjn76n3H2g_9kYqasCkr_qqa-gLfOuhoT_8ukIvpYE8bQ/viewform?usp=publish-editor"
        >
          <span id="popup-bug-report-label">Bug Report</span>
        </a>

        <a
          href="https://buymeacoffee.com/c20_40a"
          target="_blank"
          class="coffee-btn"
        >
          <img id="coffee-img" src="" alt="Buy Me A Coffee" />
        </a>
      </div>
    </div>

    <script src="dist/popup.js"></script>
  </body>
</html>
