<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. WPlace Settings</title>

    <style>
      @font-face {
        font-family: "MisakiGothic";
        src: url("assets/fonts/misaki/misaki_gothic.ttf") format("truetype");
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        background: #000;
        color: #fff;
        font-family: "MisakiGothic", monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      .container {
        border: 2px solid #fff;
        padding: 12px;
      }

      .header h2 {
        margin: 0 0 8px 0;
        font-size: 14px;
        font-weight: normal;
      }

      .setting-group {
        border: 1px solid #fff;
        padding: 8px;
        margin-bottom: 8px;
      }

      .setting-label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      /* SVG アイコン */
      .icon {
        width: 12px;
        height: 12px;
        fill: #fff;
        flex-shrink: 0;
      }

      select {
        width: 100%;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
      }

      select:focus {
        outline: none;
        background: #fff;
        color: #000;
      }

      button {
        width: 100%;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        padding: 4px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button + button {
        margin-top: 4px;
      }

      button:active {
        background: #fff;
        color: #000;
      }

      .btn-danger {
        border-style: dashed;
      }

      .coffee-support {
        border-top: 1px solid #fff;
        margin-top: 8px;
        padding-top: 8px;
      }

      /* Bug Report をボタン化 */
      .bug-button {
        margin-bottom: 8px;
      }

      /* coffee img サイズ制限 */
      .coffee-btn img {
        max-width: 100%;
        max-height: 32px;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h2>Mr. WPlace</h2>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <circle cx="6" cy="6" r="5" />
          </svg>
          Language
        </label>
        <select id="language-select">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
          <option value="ja">日本語</option>
          <option value="vi">Tiếng Việt</option>
          <option value="fr">Français</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <rect x="1" y="1" width="10" height="10" />
          </svg>
          Navigation
        </label>
        <select id="navigation-select">
          <option value="true">Map Jump</option>
          <option value="false">URL Jump</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path d="M1 1h10v10H1z M6 1v10 M1 6h10" />
          </svg>
          Tile Boundaries
        </label>
        <select id="tile-boundaries-select">
          <option value="false">Hidden</option>
          <option value="true">Visible</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 12 12">
            <path d="M2 2h8v8H2z" />
          </svg>
          Gallery Data
        </label>

        <button id="export-gallery-btn">Export</button>
        <button id="import-gallery-btn">Import</button>
        <button id="reset-gallery-btn" class="btn-danger">Reset Gallery</button>

        <input
          type="file"
          id="import-gallery-file"
          accept=".zip"
          style="display: none"
        />
      </div>

      <div class="coffee-support">
        <button
          id="feedback-link"
          class="bug-button"
          onclick="window.open('#','_blank')"
        >
          Bug Report
        </button>

        <a
          href="https://buymeacoffee.com/c20_40a"
          target="_blank"
          class="coffee-btn"
        >
          <img id="coffee-img" src="" alt="Buy Me A Coffee" />
        </a>
      </div>
    </div>

    <script src="dist/popup.js"></script>
  </body>
</html>
